<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMA Marketing Agency - Digital Services Enhanced</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* تم نقل استيراد الخطوط إلى <link> في قسم <head> لتحسين الأداء */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
            font-family: "Poppins", serif;
        }

        body {
            background: linear-gradient(270deg, #000000, #1c1c1c, #2a2a2a, #1c1c1c, #000000);
            background-size: 1000% 1000%;
            animation: gradientShift 15s ease infinite;
            color: white;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin-right: auto;
            margin-left: auto;
            padding-right: 15px;
            padding-left: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem auto;
            max-width: 1200px;
            height: auto;
            padding: 0 1rem;
            flex-wrap: wrap;
        }

        .cmalogoh { 
            width: 100px;
            height: 100px;
        }

        .navigation ul {
            display: flex;
            list-style-type: none;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .navigation a {
            text-decoration: none;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .navigation a:hover {
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc, #ffd700, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        hr {
            opacity: 10%;
            margin: 0.5rem 0;
        }

        .plan {
            width: 100%;
            max-width: 700px;
            height: auto;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: planFadeIn 1s ease-out forwards;
            animation-delay: 1s;
        }

        @keyframes planFadeIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5rem auto;
            max-width: 1200px;
            padding: 1rem;
            gap: 2rem;
        }

        .herosup {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .plan1 {
            font-size: 2.5rem;
            color: #ffffff;
            opacity: 0;
            transform: translateX(-30px);
            animation: textSlideIn 1s ease-out forwards;
            animation-delay: 0.5s;
        }

        .Don {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc, #ffd700, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateX(-30px);
            animation: textSlideIn 1s ease-out forwards;
            animation-delay: 0.8s;
        }

        @keyframes textSlideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .Contactus {
            display: inline-block;
            padding: 13px 24px;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc, #ffd700, #d4af37);
            color: rgb(0, 0, 0);
            border-radius: 25px;
            text-decoration: none;
            text-shadow: 0px 4px 4px rgba(0, 0, 0, 0);
            transition: all 0.4s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            font-weight: bold;
            text-align: center;
        }

        .Contactus:hover {
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            background: linear-gradient(90deg, #ffcc00, #ffd700, #ffb300, #ffd700, #ffcc00);
        }

        .Contactus:hover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            transform: scale(1.5);
            opacity: 0;
            animation: glowEffect 0.4s forwards;
        }

        @keyframes glowEffect {
            0% {
                opacity: 0;
                transform: scale(1.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .about {
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto 6rem auto;
        }

        .about-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
            flex-wrap: wrap;
        }

        .about-text {
            flex: 1;
            min-width: 300px;
            animation: slideInLeft 1s ease forwards;
            font-family: "Poppins", sans-serif;
        }

        .about-text h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc, #ffd700, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .about-text p {
            font-size: 1rem;
            line-height: 1.7;
            color: #dddddd;
            margin-bottom: 1rem;
        }

        .about-text p:hover {
            color: #ffffff;
        }

        .about-image {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            animation: slideInRight 1s ease forwards;
        }

        .about-image img {
            width: 100%;
            max-width: 400px;
            height: auto;
        }

        @keyframes slideInLeft {
            0% { transform: translateX(-50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .whatsapp-fixed {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            border-radius: 50%;
            padding: 14px;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .whatsapp-fixed:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px #25d366;
        }

        .whatsapp-fixed img {
            width: 30px;
            height: 30px;
            display: block;
        }

        .Ourwork {
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto 6rem auto;
        }

        .Our--work {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: left;
            margin: 5rem auto;
            max-width: 1200px;
        }

        .our-work-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc, #ffd700, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .projecttitl {
            text-align: center;
            margin-bottom: 3rem;
        }

        .projecttitl h1 {
            font-size: 3rem;
            color: #ffffff;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .projecttitl h1::after {
            content: "";
            position: absolute;
            width: 60%;
            height: 4px;
            background-color: #ffffff;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto 4rem;
            padding: 0;
            list-style: none;
        }

        .project-card {
            background: #1c1c1e;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            padding: 1.5rem 1rem;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.3);
        }

        .image-wrapper {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 1rem;
            background-color: #29292b;
        }

        .image-wrapper img, .image-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        .image-wrapper:hover img, .image-wrapper:hover video {
            transform: scale(1.08);
        }

        .project-card p {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 0.5rem;
            color: #ffffff;
        }

        .contact-form {
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            color: #fff;
        }

        .form-container h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        input, textarea {
            padding: 1rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            background-color: #2a2a2a;
            color: #fff;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            padding: 1rem;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(90deg, #ffcc00, #ffd700, #ffb300);
        }

        .footer-contact {
            background: #121212;
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .footer-left p {
            margin: 0.5rem 0;
            font-size: 1.1rem;
            color: #dddddd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-left i {
            color: #ffd700;
        }

        .footer-right a {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0 10px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .footer-right a:hover {
            color: #ffd700;
            transform: scale(1.2);
        }

        .lang-btn {
            background-color: transparent;
            border: 2px solid #ffd700;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .lang-btn:hover {
            background-color: #ffd700;
            color: black;
        }

        /* أنماط إشعار الشكر */
        .thank-you-popup, .consultation-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .thank-you-content, .consultation-content {
            background: linear-gradient(135deg, #1c1c1e, #2a2a2a);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: popup-appear 0.6s ease-out;
            position: relative;
            border: 2px solid #ffd700;
        }
        
        @keyframes popup-appear {
            0% { opacity: 0; transform: scale(0.7) translateY(-50px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .thank-you-icon, .consultation-icon {
            font-size: 80px;
            color: #ffd700;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        
        .thank-you-title, .consultation-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .thank-you-message, .consultation-message {
            font-size: 18px;
            color: #dddddd;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .thank-you-close, .consultation-btn {
            display: inline-block;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc);
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 0 5px;
        }
        
        .thank-you-close:hover, .consultation-btn:hover {
            background: linear-gradient(90deg, #ffcc00, #ffd700, #ffb300);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        /* أنماط صفحة الخدمة */
        .service-page {
            display: none;
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-page.active {
            display: block;
        }

        .service-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .service-header h1 {
            font-size: 3rem;
            color: #ffffff;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc, #ffd700, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .service-header p {
            font-size: 1.2rem;
            color: #dddddd;
            max-width: 600px;
            margin: 0 auto;
        }

        .service-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .service-item {
            background: #1c1c1e;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .service-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.3);
        }

        .service-item-media {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background-color: #29292b;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .service-item-media img,
        .service-item-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .service-item:hover .service-item-media img,
        .service-item:hover .service-item-media video {
            transform: scale(1.05);
        }

        .service-item-content {
            padding: 1.5rem;
        }

        .service-item-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .service-item-description {
            font-size: 0.9rem;
            color: #dddddd;
            line-height: 1.5;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.8rem 2rem;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: linear-gradient(90deg, #ffcc00, #ffd700, #ffb300);
            transform: translateY(-2px);
        }

        /* أنماط صفحة تفاصيل المشروع */
        .project-detail-page {
            display: none;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-detail-page.active {
            display: block;
        }

        .project-detail-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .project-detail-header h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 1rem;
        }

        .project-gallery-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .project-gallery {
            display: flex;
            overflow: hidden;
            border-radius: 15px;
            height: 400px;
            background: #1c1c1e;
        }

        .gallery-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        .gallery-slide img, .gallery-slide video, .gallery-slide .embed-responsive {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 215, 0, 0.8);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            color: #000;
            transition: all 0.3s ease;
        }

        .gallery-nav:hover {
            background: #ffd700;
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-nav.prev {
            left: 20px;
        }

        .gallery-nav.next {
            right: 20px;
        }

        .gallery-indicators {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .gallery-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gallery-indicator.active {
            background: #ffd700;
            transform: scale(1.2);
        }

        .project-info {
            background: #1c1c1e;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .project-info h3 {
            color: #ffd700;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .project-contact-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .contact-btn {
            padding: 0.8rem 2rem;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-btn:hover {
            background: linear-gradient(90deg, #ffcc00, #ffd700, #ffb300);
            transform: translateY(-2px);
        }

        /* أنماط الداش بورد */
        .dashboard-container {
            display: none;
            min-height: 100vh;
            background: linear-gradient(270deg, #000000, #1c1c1c, #2a2a2a, #1c1c1c, #000000);
            background-size: 1000% 1000%;
            animation: gradientShift 15s ease infinite;
        }

        .dashboard-container.active {
            display: block;
        }

        .dashboard-header {
            background: #1c1c1e;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .dashboard-header h1 {
            color: #ffffff;
            background: linear-gradient(90deg, #d4af37, #ffd700, #fff8dc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .dashboard-nav button {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .dashboard-nav button:hover,
        .dashboard-nav button.active {
            background: #ffd700;
            color: #000;
        }

        .dashboard-content {
            padding: 2rem;
        }

        .dashboard-section {
            display: none;
        }

        .dashboard-section.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #1c1c1e;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .stat-card h3 {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            color: #dddddd;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .form-section {
            background: #1c1c1e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .form-section h3 {
            color: #ffd700;
            margin-bottom: 1rem;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .admin-form input,
        .admin-form textarea,
        .admin-form select {
            padding: 0.8rem;

        // دالة محسنة لعرض معرض المشروع
        function createProjectGallery(work) {
            const gallery = document.getElementById('projectGallery');
            const indicators = document.getElementById('galleryIndicators');
            
            gallery.innerHTML = '';
            indicators.innerHTML = '';
            youtubePlayers = {}; // إعادة تعيين مشغلات YouTube عند إنشاء معرض جديد
            
            const allMedia = [];
            
            // إضافة الصور
            if (work.media && work.media.length > 0) {
                work.media.forEach(media => {
                    allMedia.push({type: 'image', src: media});
                });
            }
            
            // إضافة الفيديوهات
            if (work.videos && work.videos.length > 0) {
                work.videos.forEach((video, index) => {
                    allMedia.push({type: 'video', src: video, id: `youtube-player-${work.id}-${index}`});
                });
            }
            
            if (allMedia.length === 0) {
                gallery.innerHTML = `
                    <div class="gallery-slide" style="display: flex; align-items: center; justify-content: center; color: #666;">
                        <div style="text-align: center;">
                            <i class="fas fa-image" style="font-size: 4rem; margin-bottom: 1rem;"></i>
                            <p>${currentLanguage === 'ar' ? 'لا توجد وسائط متاحة' : 'No media available'}</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            allMedia.forEach((media, index) => {
                const slide = document.createElement('div');
                slide.className = 'gallery-slide';
                
                if (media.type === 'image') {
                    slide.innerHTML = `<img src="${media.src}" alt="Project Image ${index+1}" loading="lazy" style="width: 100%; height: 100%; object-fit: contain;">`;
                } else { // It's a video
                    slide.innerHTML = generateEmbedHtml(media.src, true, media.id);
                }
                
                gallery.appendChild(slide);
                
                // إنشاء مؤشر
                const indicator = document.createElement('div');
                indicator.className = 'gallery-indicator';
                if (index === 0) indicator.classList.add('active');
                indicator.onclick = () => goToSlide(index);
                indicators.appendChild(indicator);
            });
            
            currentSlide = 0;
            updateGalleryDisplay();
        }

        // دالة محسنة للتنقل بين الشرائح
        function changeSlide(direction) {
            const slides = document.querySelectorAll('.gallery-slide');
            if (slides.length === 0) return;
            
            // إيقاف أي فيديو يعمل حالياً قبل تغيير الشريحة
            stopAllVideoPlayers();

            currentSlide += direction;
            
            if (currentSlide >= slides.length) {
                currentSlide = 0;
            } else if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            }
            
            updateGalleryDisplay();
        }

        // دالة محسنة لتحديث عرض المعرض
        function updateGalleryDisplay() {
            const gallery = document.getElementById('projectGallery');
            const slides = document.querySelectorAll('.gallery-slide');
            const indicators = document.querySelectorAll('.gallery-indicator');
            
            if (gallery && slides.length > 0) {
                // استخدام transform للتحريك السلس
                gallery.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
            
            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentSlide);
            });
        }

        // الذهاب لشريحة محددة
        function goToSlide(index) {
            // إيقاف أي فيديو يعمل حالياً قبل تغيير الشريحة
            stopAllVideoPlayers();
            currentSlide = index;
            updateGalleryDisplay();
        }

        // إيقاف جميع مشغلات الفيديو (خاصة YouTube)
        function stopAllVideoPlayers() {
            for (const playerId in youtubePlayers) {
                if (youtubePlayers[playerId] && typeof youtubePlayers[playerId].pauseVideo === 'function') {
                    youtubePlayers[playerId].pauseVideo();
                }
            }
            // إيقاف عناصر <video> المباشرة
            document.querySelectorAll('.project-gallery video').forEach(video => {
                if (!video.paused) {
                    video.pause();
                }
            });
        }

        // باقي الدوال كما هي مع بعض التحسينات الطفيفة
        // ... (باقي الدوال كما هي)

        // تهيئة النظام عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            initializeSystem();
            
            // التحقق من معاملات URL
            if (window.location.search.includes('submitted=true')) {
                document.getElementById('thankYouPopup').style.display = 'flex';
                const url = new URL(window.location);
                url.searchParams.delete('submitted');
                window.history.replaceState({}, document.title, url.toString());
            }

            // معالج نموذج الاستشارة
            const consultationForm = document.getElementById('consultationForm');
            if (consultationForm) {
                consultationForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const form = e.target;
                    const name = form.elements.consultationName.value;
                    const phone = form.elements.consultationPhone.value;
                    const email = form.elements.consultationEmail.value;

                    if (name && phone && email) {
                        const consultation = {
                            id: Date.now(),
                            name: name,
                            phone: phone,
                            email: email,
                            date: new Date().toISOString(),
                            status: 'جديد'
                        };

                        const data = JSON.parse(localStorage.getItem('cmaData'));
                        data.consultations.push(consultation);
                        localStorage.setItem('cmaData', JSON.stringify(data));

                        sendConsultationEmail(consultation);

                        localStorage.setItem('consultationRequested', 'true');
                        closeConsultationPopup();

                        alert(currentLanguage === 'ar' ?
                            'تم طلب الاستشارة بنجاح! سنتواصل معك قريباً.' :
                            'Consultation requested successfully! We will contact you soon.');

                        updateStats();
                        form.reset();
                    }
                });
            }
        });

        // معالجة أحداث لوحة المفاتيح للمعرض
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('projectDetailPage').classList.contains('active')) {
                if (e.key === 'ArrowLeft') {
                    changeSlide(-1);
                } else if (e.key === 'ArrowRight') {
                    changeSlide(1);
                } else if (e.key === 'Escape') {
                    backToService();
                }
            }
        });

        // دعم التمرير باللمس للمعرض
        let touchStartX = 0;
        let touchEndX = 0;

        document.getElementById('projectGallery').addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.getElementById('projectGallery').addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    changeSlide(1); // تمرير لليسار
                } else {
                    changeSlide(-1); // تمرير لليمين
                }
            }
        }
    </script>
